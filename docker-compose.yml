# Local development stack for testing the axum-apm library.
#
# APM Server 8.x accepts OTLP/HTTP on port 8200 (the `/v1/traces` endpoint
# this library exports to). Security is disabled for local development.
services:
  apm-server:
    image: docker.elastic.co/apm/apm-server:8.19.25
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    ports:
      - 8200:8200
    networks:
      - elastic
    command: >
      apm-server -e
        -E apm-server.rum.enabled=true
        -E apm-server.kibana.enabled=true
        -E apm-server.kibana.host=kibana:5601
        -E setup.kibana.host=kibana:5601
        -E setup.template.settings.index.number_of_replicas=0
        -E output.elasticsearch.hosts=["elasticsearch:9200"]
    healthcheck:
      interval: 10s
      retries: 12
      # APM Server 8.x answers 404 on `/`, so accept any HTTP response as "up".
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8200/"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    networks:
      - elastic
    healthcheck:
      interval: 20s
      retries: 10
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.25
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - 5601:5601
    networks:
      - elastic
    healthcheck:
      interval: 10s
      retries: 20
      test: ["CMD-SHELL", "curl -s -f -o /dev/null http://localhost:5601/api/status"]

volumes:
  esdata:
    driver: local

networks:
  elastic:
    driver: bridge
