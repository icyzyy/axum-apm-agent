[package]
name = "axum-apm"
version = "0.1.0"
edition = "2024"
# Edition 2024 requires Rust 1.85+.
rust-version = "1.85"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.33"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
hostname = "0.4"
regex = "1.12"
thiserror = "2"

[dev-dependencies]
# Enables `opentelemetry::testing::trace::TestSpan` for unit tests only.
opentelemetry = { version = "0.32", features = ["testing"] }
# Enables `opentelemetry_sdk::trace::InMemorySpanExporter` for unit tests only.
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
